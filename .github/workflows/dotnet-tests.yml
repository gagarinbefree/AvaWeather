name: Test and release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/export_swift_localization.py --check
      - run: python3 -m unittest discover -s tools -p test_prepare_avalonia_pages.py
      - run: python3 -m unittest discover -s tools -p test_browser_seo.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node AvaWeather.Browser/tests/startup.test.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install wasm-tools
      - run: dotnet restore AvaWeather.DesktopWeb.slnf
      - run: dotnet build AvaWeather.DesktopWeb.slnf --no-restore --configuration Release
      - run: dotnet test AvaWeather.Tests/AvaWeather.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./**/TestResults/*.trx
          if-no-files-found: ignore

  prepare-release:
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Require WeatherAPI key
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: test -n "$WEATHER_API_KEY"
      - name: Verify WeatherAPI release key
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python3 tools/check_weatherapi_key.py
      - id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  web-pages:
    needs: [build-and-test, prepare-release]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install wasm-tools
      - name: Publish Avalonia Browser site
        run: dotnet publish AvaWeather.Browser/AvaWeather.Browser.csproj --configuration Release -p:Version="${{ needs.prepare-release.outputs.version }}"
      - name: Check browser bundle size and weather handlers
        run: python3 tools/test_browser_bundle.py AvaWeather.Browser/bin/Release/net10.0-browser/publish/wwwroot
      - name: Prepare GitHub Pages files
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python3 tools/prepare_avalonia_pages.py AvaWeather.Browser/bin/Release/net10.0-browser/publish/wwwroot
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: AvaWeather.Browser/bin/Release/net10.0-browser/publish/wwwroot
      - id: deploy
        uses: actions/deploy-pages@v4

  publish:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-x64,   os: macos-15-intel }
          - { rid: osx-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate encrypted key source
        shell: bash
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: dotnet run --project tools/KeyEmbedder/KeyEmbedder.csproj -- AvaWeather/obj/EmbeddedWeatherApiKey.g.cs
      - name: Verify macOS Dock icon
        if: startsWith(matrix.rid, 'osx-')
        run: dotnet test AvaWeather.Tests/AvaWeather.Tests.csproj --configuration Release --filter Mac_dock_uses_icon_embedded_in_the_executable
      - name: Publish one self-contained file
        shell: bash
        run: |
          dotnet publish AvaWeather/AvaWeather.csproj --configuration Release --runtime "${{ matrix.rid }}" --self-contained true \
            -p:Version="${{ needs.prepare-release.outputs.version }}" \
            -p:EmbeddedKeySource=obj/EmbeddedWeatherApiKey.g.cs \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=embedded \
            -p:PublishTrimmed=false \
            --output publish
          mkdir -p dist
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            test -f publish/AvaWeather.exe
            cp publish/AvaWeather.exe "dist/AvaWeather-${{ matrix.rid }}.exe"
          else
            test -f publish/AvaWeather
            chmod +x publish/AvaWeather
            if [[ "${{ matrix.rid }}" == osx-* ]]; then
              cp publish/AvaWeather "dist/AvaWeather-${{ matrix.rid }}"
              chmod +x "dist/AvaWeather-${{ matrix.rid }}"
              test -x "dist/AvaWeather-${{ matrix.rid }}"
            else
              tar -C publish -czf "dist/AvaWeather-${{ matrix.rid }}.tar.gz" AvaWeather
            fi
          fi
          files=(dist/*)
          test "${#files[@]}" -eq 1
      - name: Build and verify Windows installer
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./tools/build_windows_installer.ps1 -Architecture "${{ matrix.rid }}".Substring(4) -Version "${{ needs.prepare-release.outputs.version }}"
      - name: Build and verify macOS installer
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: bash tools/build_macos_installer.sh "${{ needs.prepare-release.outputs.version }}" "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  android:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: dotnet workload install android
      - name: Build Android package
        run: dotnet build AvaWeather.Android/AvaWeather.Android.csproj --configuration Release -p:ApplicationDisplayVersion="1.0.${{ github.run_number }}" -p:ApplicationVersion="${{ github.run_number }}"
      - name: Generate encrypted WeatherAPI key
        if: github.event_name != 'pull_request'
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: dotnet run --project tools/KeyEmbedder/KeyEmbedder.csproj -- AvaWeather.Android/obj/EmbeddedWeatherApiKey.g.cs
      - name: Publish signed Android APK
        id: sign
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo 'Android signing secrets are missing; the Android project was built but no release APK was published.'
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avaweather.keystore"
          dotnet publish AvaWeather.Android/AvaWeather.Android.csproj --configuration Release \
            -p:Version="1.0.${{ github.run_number }}" \
            -p:ApplicationDisplayVersion="1.0.${{ github.run_number }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:EmbeddedKeySource=obj/EmbeddedWeatherApiKey.g.cs \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/avaweather.keystore" \
            -p:AndroidSigningKeyAlias=avaweather \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD
          signed_apk=$(find AvaWeather.Android/bin/Release -path '*/publish/*-Signed.apk' -print -quit)
          test -n "$signed_apk"
          mkdir -p dist
          cp "$signed_apk" dist/AvaWeather-android.apk
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: release-android
          path: dist/AvaWeather-android.apk
          if-no-files-found: error

  widget-windows:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest }
          - { arch: arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate encrypted WeatherAPI key
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: dotnet run --project tools/KeyEmbedder/KeyEmbedder.csproj -- AvaWeather/obj/EmbeddedWeatherApiKey.g.cs
      - name: Build signed MSIX widget
        shell: pwsh
        run: ./tools/build_windows_widget.ps1 -Version "1.0.${{ github.run_number }}" -Architecture "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-widget-win-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  widget-macos:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, rid: osx-x64, os: macos-15-intel }
          - { arch: arm64, rid: osx-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build WidgetKit app
        env:
          WEATHER_API_KEY: ${{ github.event_name != 'pull_request' && secrets.WEATHER_API_KEY || '' }}
        run: bash tools/build_macos_widget.sh "1.0.${{ github.run_number }}" "${{ matrix.arch }}"
      - name: Rename architecture asset
        run: mv "dist/AvaWeather-widget-osx-${{ matrix.arch }}.zip" "dist/AvaWeather-widget-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-widget-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare-release, publish, widget-windows, widget-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: gh release create "v$VERSION" release-assets/* --target "$GITHUB_SHA" --title "AvaWeather v$VERSION" --generate-notes --latest
      - name: Update version in README
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          python3 tools/update_readme_release.py "v$VERSION"
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update release version to v$VERSION [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  android-release:
    needs: [prepare-release, android, release]
    if: needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - name: Attach signed Android APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" dist/AvaWeather-android.apk --clobber
