name: AvaWeatherWidget
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  AvaWeatherWidgetHost:
    type: application
    platform: macOS
    sources:
      - Host
      - Shared
      - Resources
    info:
      path: Host/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gagarinbefree.AvaWeatherWidget
        INFOPLIST_FILE: Host/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Network.entitlements
    dependencies:
      - target: WeatherWidgetExtension
        embed: true
  WeatherWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - Extension
      - Shared
      - Resources
    info:
      path: Extension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gagarinbefree.AvaWeatherWidget.Extension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        SKIP_INSTALL: 'YES'
        CODE_SIGN_ENTITLEMENTS: Network.entitlements
        APPLICATION_EXTENSION_API_ONLY: 'YES'
schemes:
  AvaWeatherWidgetHost:
    build:
      targets:
        AvaWeatherWidgetHost: all
        WeatherWidgetExtension: all
