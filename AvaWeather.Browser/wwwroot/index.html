<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F7FA" />
    <meta name="apple-mobile-web-app-title" content="AvaWeather" />
    <base href="/" />
    <title>AvaWeather — Local Weather Forecast</title>
    <meta name="description" content="AvaWeather shows current weather, hourly conditions and a three-day forecast for your detected location. Available in English and Russian." />
    <link rel="canonical" href="https://gagarinbefree.github.io/AvaWeather/" />
    <link rel="icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/app-icon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AvaWeather — Local Weather Forecast" />
    <meta property="og:description" content="Current weather, hourly conditions and a three-day forecast for your location." />
    <meta property="og:url" content="https://gagarinbefree.github.io/AvaWeather/" />
    <meta property="og:image" content="https://gagarinbefree.github.io/AvaWeather/preview-weather-colors.png" />
    <meta property="og:image:alt" content="AvaWeather weather forecast interface" />
    <meta name="twitter:card" content="summary_large_image" />
    <noscript><style>.boot-spinner { display: none; }</style></noscript>
    <link rel="stylesheet" href="app.css" />
    <link rel="modulepreload" href="startup.js" />
    <link rel="modulepreload" href="_framework/dotnet.js" />
    <script type="module" src="main.js"></script>
</head>
<body>
    <div id="boot-status" class="boot-screen" aria-busy="true">
        <div class="boot-content">
            <img class="boot-logo" src="favicon.ico" alt="" />
            <h1 class="boot-title">AvaWeather</h1>
            <p class="boot-summary">Current weather, hourly conditions and a three-day forecast for your location.</p>
            <nav class="boot-links" aria-label="About AvaWeather">
                <a class="boot-link" href="about.html">About AvaWeather</a>
                <a class="boot-link" href="ru/about.html" lang="ru">О приложении</a>
            </nav>
            <div class="boot-spinner" role="progressbar" aria-label="AvaWeather"></div>
            <p class="boot-progress">
                <span class="boot-progress-label">Loading application…</span>
                <span class="boot-progress-assemblies"></span>
            </p>
            <p class="boot-error" role="alert" hidden></p>
            <noscript><p>JavaScript is required for the live forecast. You can still read <a href="about.html">about AvaWeather</a>.</p></noscript>
        </div>
    </div>
    <div id="out"></div>
</body>
</html>
