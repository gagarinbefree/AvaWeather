<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>AvaWeather</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="main.js"></script>
</head>
<body>
    <div id="boot-status" class="boot-screen" aria-busy="true">
        <div class="boot-content">
            <img class="boot-logo" src="favicon.ico" alt="" />
            <strong class="boot-title">AvaWeather</strong>
            <div class="boot-spinner" role="progressbar" aria-label="AvaWeather"></div>
            <p class="boot-error" role="alert" hidden></p>
        </div>
    </div>
    <div id="out"></div>
</body>
</html>
